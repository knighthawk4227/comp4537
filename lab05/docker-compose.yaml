services:
  postgres:
    container_name: postgres
    image: postgres:latest
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - LAB5_WRITER_PW=${LAB5_WRITER_PW}
      - LAB5_READER_PW=${LAB5_READER_PW}
      # - POSTGRES_DB=${POSTGRES_DB}
    ports:
     - "5432:5432"

    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/init.sql:/opt/lab5/init.sql:ro
      # Postgres checks this on start up if empty will run 00-lab5.sh which is a bash script to setup DB
      - ./db/00-lab5.sh:/docker-entrypoint-initdb.d/00-lab5.sh:ro

    restart: unless-stopped

# docker creates this volume
volumes:
  pgdata:


